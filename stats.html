<style>
:root{--bg:#f2f2f7;--text:#1c1c1e;--text-dim:#8e8e93;--card-bg:rgba(255,255,255,.92);--card-border:rgba(255,255,255,.5);--panel-bg:#fff;--subtle-bg:#f8f8fc;--subtle-bg-2:#f0f0f5;--divider:#e5e5ea;--accent:#007aff;--good:#2e7d32;--bad:#c62828;
--work-bg:#e8f5e9;--work-text:#2e7d32;--short-bg:#fff3e0;--short-text:#e65100;--bad-bg:#ffebee}
:root[data-theme="dark"]{--bg:#0a0a0f;--text:#f2f2f7;--card-bg:rgba(28,28,30,.95);--card-border:rgba(255,255,255,.06);--panel-bg:rgba(28,28,30,.95);--subtle-bg:#1c1c1e;--subtle-bg-2:#2c2c2e;--divider:#2c2c2e;--good:#66bb6a;--bad:#ff6b6b;
--work-bg:#1a2a1a;--work-text:#66bb6a;--short-bg:#2a1a0a;--short-text:#ffa726;--bad-bg:#2a1212}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;background:var(--bg);min-height:100vh;min-height:100dvh;color:var(--text);padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(70px + env(safe-area-inset-bottom,0px));transition:background .3s}
.container{max-width:480px;margin:0 auto;padding:12px 16px 30px;display:flex;flex-direction:column;gap:12px}
header{background:linear-gradient(135deg,#007aff,#0055b3);border-radius:16px;padding:16px 20px;box-shadow:0 4px 16px rgba(0,122,255,.3)}
header h1{color:#fff;font-size:22px;font-weight:600;letter-spacing:-.3px}
.header-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-top:6px}
.badge{background:rgba(255,255,255,.2);padding:4px 14px;border-radius:20px;font-size:15px;font-weight:500;color:#fff}
.theme-switch{position:relative}.theme-switch input{display:none}
.theme-label{display:flex;align-items:center;justify-content:space-between;width:56px;height:30px;background:rgba(255,255,255,.2);border-radius:30px;padding:0 6px;cursor:pointer;border:1px solid rgba(255,255,255,.15)}
.theme-label span{font-size:14px;z-index:2;opacity:.5}
.toggle-ball{position:absolute;top:2px;left:2px;width:24px;height:24px;background:#fff;border-radius:50%;transition:transform .3s;box-shadow:0 2px 8px rgba(0,0,0,.2);z-index:1}
#theme-toggle:checked+.theme-label .toggle-ball{transform:translateX(26px)}
#theme-toggle:checked+.theme-label .moon,#theme-toggle:not(:checked)+.theme-label .sun{opacity:1}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
details.acc>summary{padding:14px 18px;background:var(--panel-bg);border-radius:14px;font-size:16px;font-weight:500;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.05);border:1px solid var(--card-border)}
details.acc>summary::after,details.sub>summary::after{content:"▼";font-size:13px;color:var(--text-dim);transition:transform .3s}
details[open]>summary::after{transform:rotate(180deg)}
.acc-body{background:var(--panel-bg);border-radius:14px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.05);border:1px solid var(--card-border);margin-top:6px}
details.sub{margin-top:6px}
details.sub>summary{padding:10px 12px;background:var(--subtle-bg);border-radius:12px;font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 0 2px}
.stat-card{background:var(--subtle-bg);padding:12px;border-radius:12px;text-align:center;border-left:3px solid transparent;min-width:0}
.stat-card.wide{grid-column:1/-1}
.stat-today{border-left-color:#007aff}.stat-month{border-left-color:#34c759}.stat-all{border-left-color:#ff9500}
.stat-card.c-warn{background:var(--short-bg);color:var(--short-text);border-left-color:#ff9500}
.stat-card.c-good{background:var(--work-bg);color:var(--work-text);border-left-color:#34c759}
.stat-card.c-bad{background:var(--bad-bg);color:var(--bad);border-left-color:#ff3b30}
.stat-card.c-accent .stat-value{color:var(--accent)}
.stat-label{display:block;font-size:11px;color:var(--text-dim);font-weight:500;margin-bottom:4px}
.stat-card[class*="c-"] .stat-label{color:inherit;opacity:.8}
.stat-value{display:block;font-size:18px;font-weight:700;overflow-wrap:anywhere}
.stat-sub{display:block;font-size:11px;color:var(--text-dim);overflow-wrap:anywhere}
.pos{color:var(--good)}.neg{color:var(--bad)}
.hint{font-size:12px;color:var(--text-dim);margin-bottom:8px}
.box{padding:10px 12px;border-radius:10px;background:var(--subtle-bg-2);font-size:13px;line-height:1.6}
.box.warn{border-left:3px solid #ff9500}
.empty-note{text-align:center;color:var(--text-dim);padding:16px;font-size:13px}
.avg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.avg-card{background:var(--panel-bg);border-radius:10px;padding:8px;text-align:center}
.avg-card small{display:block;font-size:10px;color:var(--text-dim)}
.avg-card b{display:block;font-size:14px;color:var(--accent)}
.forecast-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.forecast-card{background:var(--subtle-bg);border-radius:12px;padding:12px;text-align:center}
.forecast-card small{display:block;font-size:11px;color:var(--text-dim)}
.forecast-card b{display:block;font-size:17px;color:var(--accent)}
.progress{background:var(--divider);border-radius:8px;height:8px;overflow:hidden}
.progress>div{background:#007aff;height:100%;border-radius:8px}
.analytics-card{background:var(--subtle-bg);border-radius:14px;padding:14px;margin-bottom:14px}
.analytics-card:last-child{margin-bottom:0}
.analytics-card h4{font-size:14px;margin-bottom:10px}
.chart-scroll-wrap{overflow-x:auto}
.chart-legend{margin-top:6px;font-size:12px;color:var(--text-dim);display:flex;flex-wrap:wrap;gap:8px}
.legend-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.top-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--divider);font-size:13px;gap:6px}
.filter-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:16px;padding:12px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.filter-title{font-size:13px;font-weight:600;margin-bottom:8px}
.range-row{display:flex;align-items:center;gap:8px}
.sel{flex:1;min-width:0;padding:10px 12px;border:1.5px solid var(--divider);border-radius:12px;font-size:15px;background:var(--subtle-bg);color:var(--text);min-height:42px;font-family:inherit}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{padding:6px 12px;border-radius:20px;border:1.5px solid var(--divider);background:var(--panel-bg);color:var(--text);font-size:12px;cursor:pointer}
.chip:active{background:var(--accent);color:#fff}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--panel-bg);border-top:1px solid var(--divider);padding-bottom:env(safe-area-inset-bottom,0px);z-index:100}
.tabbar .in{display:flex;width:100%;max-width:480px}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 1px;color:var(--text-dim);font-size:10px;font-weight:600;text-decoration:none;text-align:center;min-width:0}
.tabbar span{font-size:19px;line-height:1}
.tabbar .active{color:var(--accent)}
@media(max-width:400px){.container{padding:8px 10px 20px}header h1{font-size:18px}.stats-grid,.forecast-grid{grid-template-columns:1fr}.tabbar a{font-size:9px}.tabbar span{font-size:17px}}
</style>

<div class="container">

<header>
  <h1>📊 Статистика и аналитика</h1>
  <div class="header-row">
    <span class="badge" id="monthlyCounter">📊 0</span>
    <div class="theme-switch">
      <input type="checkbox" id="theme-toggle"/>
      <label for="theme-toggle" class="theme-label"><span class="sun">☀</span><span class="moon">🌙</span><div class="toggle-ball"></div></label>
    </div>

<div class="filter-card">
  <div class="filter-title">📅 Период: месяцы включительно</div>
  <div class="range-row">

  <div class="chips">

    <button class="chip" onclick="quickRange('all')">Всё время</button>
  </div>

<details class="acc" id="statsSection" open><summary><span>📊 Статистика</span></summary>

    <div id="statsBlocks"></div>
    <div id="avgByDayType" style="margin-top:12px"></div>
    <details class="sub" open><summary>📊 ЭКОНОМИКА ЗАКАЗА</summary><div id="orderEconomyContent"></div></details>
  </div>
</details>

<script>
// ============================================================
//  «СТАТИСТИКА» — только чтение из localStorage, без облака.
//  Читает: courierData, cashOperations, cashCategories, fuelLog,
//          dailyKmLog, mileageData, oilData, filterData, theme.
//  Единая формула чистого дохода: зарплата + чаевые + прочий приход − расходы.
//  Топливо: fuelLog; для месяцев, где журнал пуст (после «Сбросить топливо»), — из cashOperations.
// ============================================================
const $ = id => document.getElementById(id);
const LS = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
const pad = n => String(n).padStart(2, "0");
const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
const sum = (arr, f) => arr.reduce((s, x) => s + f(x), 0);
const empty = t => `<p class="empty-note">${t}</p>`;
function getLocalDateStr(d) {
    const date = d ? new Date(d) : new Date();
    return new Date(date.getTime() - date.getTimezoneOffset() * 60000).toISOString().split("T")[0];
}

const MONTHS = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const MONTHS_SHORT = ["Янв","Фев","Мар","Апр","Май","Июн","Июл","Авг","Сен","Окт","Ноя","Дек"];
const DAY_TYPES = {
    work:          { icon: "🏢",   short: "Рабочий" },
    help:          { icon: "🤝",   short: "Подмога" },
    short:         { icon: "⚡",   short: "Короткий" },
    replace:       { icon: "🔄",   short: "Замена" },
    short_replace: { icon: "⚡🔄", short: "Кор.замена" },
    weekend:       { icon: "🏖",   short: "Выходной" }
};
const TYPE_KEYS = Object.keys(DAY_TYPES);
const getDayTypeIcon = t => DAY_TYPES[t] ? DAY_TYPES[t].icon : "📅";

// Безопасное чтение массивов: мусор в localStorage не ломает страницу, числа приводятся к Number
// Числа вида "-12,5" / "−12.5" и даты в любом разумном формате (ISO с временем, дд.мм.гггг, timestamp)
const num = v => { if (typeof v === "number") return isFinite(v) ? v : 0; const n = parseFloat(String(v == null ? "" : v).replace(/\s/g, "").replace(/[−–—]/g, "-").replace(",", ".")); return isFinite(n) ? n : 0; };
const normDate = v => {
    if (v == null || v === "") return "";
    if (typeof v === "number") return getLocalDateStr(v);
    const s = String(v).trim();
    let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) {
        if (s.length > 10 && /(Z|[+-]\d{2}:?\d{2})$/i.test(s)) { const d = new Date(s); if (!isNaN(d)) return getLocalDateStr(d); }
        return m[0];
    }
    m = s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})/);
    if (m) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
    const d = new Date(s); return isNaN(d) ? "" : getLocalDateStr(d);
};
const rawDate = o => normDate(o.date ?? o.timestamp ?? o.ts ?? o.createdAt ?? o.time);
const arr = k => { const v = LS(k, []); return Array.isArray(v) ? v.filter(x => x && typeof x === "object") : []; };
const getHistory = () => arr("courierData").map(d => ({ ...d, date: rawDate(d), total: num(d.total), nightOrders: num(d.nightOrders), apOrders: num(d.apOrders) })).filter(d => d.date)
    .sort((a, b) => a.date.localeCompare(b.date));
// Касса + операции из «Финансов» (localStorage["fin"].istorija).
// Если за день в кассе уже есть записи — день считается кассой (чтобы не удвоить зеркальные записи).
let _ops = null;
function finOps() {
    const f = LS("fin", null);
    if (!f || !Array.isArray(f.istorija)) return [];
    const out = [];
    f.istorija.forEach(z => {
        if (!z || typeof z !== "object") return;
        const date = normDate(z.data); if (!date) return;
        const s = Math.abs(num(z.summa)); if (!(s > 0)) return;
        const v = z.baz != null ? Math.abs(num(z.baz)) : s; // в леях
        const kat = String(z.kat || "Без категории");
        let type = null, amount = 0;
        if (z.tip === "Трата" || (z.tip === "Кредитка" && z.napr === "покупка")) { type = "fin:" + kat; amount = -v; }
        else if (z.tip === "Доход") {
            if (kat === "Чаевые") { type = "tips"; amount = v; }
            else if (!/зарплат|начальн/i.test(kat)) { type = "fin:" + kat; amount = v; }
        }
        if (type) out.push({ id: "fin" + z.id, date, type, amount, comment: z.zametka || "", src: "fin" });
    });
    return out;
}
function cashOps() {
    if (_ops) return _ops;
    const base = arr("cashOperations").map(o => ({ ...o, amount: num(o.amount), date: rawDate(o) }));
    const days = new Set(base.map(o => o.date));
    return (_ops = base.concat(finOps().filter(o => !days.has(o.date))));
}
// переводы между своими счетами, начальные остатки и сверки — не доход
const isTransferOp = o => o.type === "start" || /перевод|сверк|начальн/i.test(catName(o.type));
const isOtherIncome = o => o.amount > 0 && o.type !== "tips" && !DEBT_TYPES.includes(o.type) && !isTransferOp(o);
const kmLog = () => arr("dailyKmLog").map(e => ({ ...e, km: num(e.km), date: rawDate(e) }));
const fuelEntries = () => arr("fuelLog").map(e => ({ ...e, amount: Math.abs(num(e.amount)), liters: num(e.liters), date: rawDate(e) }));
const DEBT_TYPES = ["debt_taken", "debt_given", "debt_repaid", "debt_returned"];
const isRealExpense = op => op.amount < 0 && !DEBT_TYPES.includes(op.type);

let _cats = null; // кэш категорий (сбрасывается в refreshAll)
const getCats = () => _cats || (_cats = arr("cashCategories"));
function isFuelOp(op) {
    if (op.amount >= 0) return false;
    if (op.type === "fuel_quick") return true;
    if (String(op.type).startsWith("fin:")) return /топлив/i.test(op.type);
    const c = getCats().find(c => c.id === op.type);
    return !!c && /топлив/i.test(c.name);
}
const catName = id => {
    if (String(id).startsWith("fin:")) return id.slice(4);
    const c = getCats().find(c => c.id === id);
    if (c) return c.name;
    const SYS = { tips: "💵 Чаевые", debt_taken: "📥 Взял в долг", debt_given: "📤 Дал в долг", debt_repaid: "✅ Вернул долг", debt_returned: "✅ Мне вернули", fuel_quick: "⛽ Топливо" };
    return SYS[id] || "❔ Без категории";
};

// ============================================================
//  ТЕМА
// ============================================================
function initThemeToggle() {
    const t = $("theme-toggle");
    t.checked = document.documentElement.getAttribute("data-theme") === "dark";
    t.addEventListener("change", function () {
        const v = this.checked ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", v);
        try { localStorage.setItem("theme", v); } catch (e) {}
        if ($("analytics").open) renderAnalytics();
        if ($("cashSection").open) renderCash();
    });
}

// ============================================================
//  ФИЛЬТР ПЕРИОДА
// ============================================================
const ym = (y, m) => `${y}-${pad(m)}`;
let rangeFrom = "", rangeTo = "";
const inRange = ds => { const k = (ds || "").slice(0, 7); return k >= rangeFrom && k <= rangeTo; };
const mLabel = k => `${MONTHS[+k.slice(5) - 1]} ${k.slice(0, 4)}`;
const rangeLabel = () => rangeFrom === rangeTo ? mLabel(rangeFrom) : `${mLabel(rangeFrom)} — ${mLabel(rangeTo)}`;
function allMonthKeys() {
    const set = new Set([getLocalDateStr().slice(0, 7)]);
    if (rangeFrom) set.add(rangeFrom);
    if (rangeTo) set.add(rangeTo);
    // только корректные даты 20xx-MM, чтобы мусорная дата не раздула список месяцев
    [getHistory(), cashOps(), fuelEntries(), kmLog()].forEach(a => a.forEach(x => { if (/^20\d{2}-(0[1-9]|1[0-2])/.test(x.date || "")) set.add(x.date.slice(0, 7)); }));
    const s = [...set].sort(), out = [];
    let [y, m] = s[0].split("-").map(Number); const [ey, em] = s[s.length - 1].split("-").map(Number);
    while (y < ey || (y === ey && m <= em)) { out.push(ym(y, m)); if (++m > 12) { m = 1; y++; } }
    return out;
}
const monthKeys = () => allMonthKeys().filter(k => k >= rangeFrom && k <= rangeTo);
function buildRangeSelects() {
    const html = allMonthKeys().map(k => `<option value="${k}">${mLabel(k)}</option>`).join("");
    $("rangeFrom").innerHTML = html; $("rangeTo").innerHTML = html;
    $("rangeFrom").value = rangeFrom; $("rangeTo").value = rangeTo;
}
function onRangeChange() {
    rangeFrom = $("rangeFrom").value; rangeTo = $("rangeTo").value;
    if (rangeFrom > rangeTo) [rangeFrom, rangeTo] = [rangeTo, rangeFrom];
    refreshAll();
}
function quickRange(q) {
    const now = new Date(), y = now.getFullYear(), m = now.getMonth() + 1, cur = ym(y, m);
    const back = n => { const d = new Date(y, m - 1 - n, 1); return ym(d.getFullYear(), d.getMonth() + 1); };
    if (q === "1") { rangeFrom = rangeTo = cur; }
    else if (q === "prev") { rangeFrom = rangeTo = back(1); }
    else if (q === "3") { rangeFrom = back(2); rangeTo = cur; }
    else if (q === "year") { rangeFrom = `${y}-01`; rangeTo = cur; } // до текущего месяца, без пустых будущих
    else { const k = allMonthKeys(); rangeFrom = k[0]; rangeTo = k[k.length - 1]; }
    refreshAll();
}
function refreshAll() {
    _cats = null; _ops = null;
    buildRangeSelects();
    updateTotals(); renderForecast();
    if ($("cashSection").open) renderCash();
    if ($("analytics").open) renderAnalytics();
}

// ============================================================
//  ЕДИНАЯ ФОРМУЛА «ЧИСТОГО ДОХОДА»
// ============================================================
function netIncome(inc, tips, otherInc, expenses) {
    return (inc + tips + otherInc) - expenses;
}

// ============================================================
//  ТОПЛИВО: fuelLog; для месяцев без записей в журнале — из cashOperations
// ============================================================
function fuelForPeriod(pred) {
    const log = fuelEntries();
    const logMonths = new Set(log.map(e => e.date.slice(0, 7)));
    const fromLog = log.filter(e => pred(e.date));
    const fromCash = cashOps().filter(o => isFuelOp(o) && pred(o.date) && !logMonths.has(o.date.slice(0, 7)));
    let liters = sum(fromLog, e => e.liters);
    fromCash.forEach(o => {
        const m = String(o.comment || "").replace(",", ".").match(/(\d+(?:\.\d+)?)\s*[*xх×]\s*(\d+(?:\.\d+)?)/i);
        if (m) liters += +m[1];
    });
    return {
        sum: sum(fromLog, e => e.amount) + sum(fromCash, o => Math.abs(o.amount)),
        liters,
        count: fromLog.length + fromCash.length,
        source: fromCash.length ? (fromLog.length ? "mixed" : "cashOperations") : "fuelLog"
    };
}

function updateTotals() {
    const hist = getHistory(), today = getLocalDateStr(), ops_all = cashOps();
    const T = { total: 0, night: 0, ap: 0 }, M = { income: 0, night: 0, ap: 0, days: 0 }, A = { total: 0, night: 0, ap: 0 };
    hist.forEach(d => {
        const n = d.nightOrders, a = d.apOrders, t = d.total;
        A.total += t; A.night += n; A.ap += a;
        if (d.date === today) { T.total += t; T.night += n; T.ap += a; }
        if (inRange(d.date)) { M.income += t; M.night += n; M.ap += a; if (n + a > 0) M.days++; }
    });

    // зарплата + чаевые + прочий приход − расходы (долги не считаются ни доходом, ни расходом)
    function breakdownFor(pred) {
        const ops = ops_all.filter(o => pred(o.date));
        const tips = sum(ops.filter(o => o.type === "tips"), o => o.amount);
        const otherInc = sum(ops.filter(isOtherIncome), o => o.amount);
        const expenses = sum(ops.filter(isRealExpense), o => Math.abs(o.amount));
        return { tips, otherInc, expenses };
    }
    const todayB = breakdownFor(d => d === today);
    const monthB = breakdownFor(d => inRange(d));
    const allB   = breakdownFor(() => true);

    const todayFuel = fuelForPeriod(d => d === today).sum;
    const monthFuel = fuelForPeriod(d => inRange(d)).sum;
    const allFuel   = fuelForPeriod(() => true).sum;

    const netToday = netIncome(T.total, todayB.tips, todayB.otherInc, todayB.expenses);
    const netMonth = netIncome(M.income, monthB.tips, monthB.otherInc, monthB.expenses);
    const netAll   = netIncome(A.total, allB.tips, allB.otherInc, allB.expenses);

    const wDetail = ops => {
        const m = {}; ops.forEach(o => { const n = catName(o.type); m[n] = (m[n] || 0) + Math.abs(o.amount); });
        return Object.entries(m).map(([k, v]) => k + " " + v.toFixed(0)).join(" · ") || "—";
    };
    const todayReal = ops_all.filter(o => o.date === today && isRealExpense(o));
    const monthReal = ops_all.filter(o => inRange(o.date) && isRealExpense(o));

    setVals({
        todayWalletExpense: todayB.expenses.toFixed(2),
        todayWalletDetail: todayReal.length ? wDetail(todayReal) : "трат сегодня нет",
        monthWalletExpense: monthB.expenses.toFixed(2),
        monthWalletDetail: wDetail(monthReal),
        total: T.total, todayNight: T.night, todayAp: T.ap, todayTrips: T.night + T.ap,
        todayScooterExpense: todayFuel.toFixed(2), todayCashTips: todayB.tips.toFixed(2),
        todayNetIncome: netToday.toFixed(2),
        monthStatsLabel: rangeLabel(),
        monthlyIncome: M.income, monthNight: M.night, monthAp: M.ap, monthTrips: M.night + M.ap,
        monthScooterExpense: monthFuel.toFixed(2), monthNetIncome: netMonth.toFixed(2),
        monthAvgDay: M.days ? Math.round(M.income / M.days) : 0,
        allTotal: A.total, allAp: A.ap, allNight: A.night,
        allScooterExpense: allFuel.toFixed(2),
        allNetIncome: netAll.toFixed(2)
    });
    const counter = $("monthlyCounter");
    counter.textContent = `📊 ${M.night + M.ap}`;
    counter.title = `${rangeLabel()}: 🌙${M.night} 📦${M.ap} — ${M.income} лей`;

    renderAvgByDayType(hist);
    renderOrderEconomy(hist, monthFuel);
}

function renderOrderEconomy(hist, monthFuel) {
    const days = hist.filter(d => inRange(d.date) && (d.nightOrders > 0 || d.apOrders > 0));
    const night = sum(days, d => d.nightOrders), ap = sum(days, d => d.apOrders), income = sum(days, d => d.total);
    const orders = night + ap, workDays = days.length;
    const otherExp = sum(cashOps().filter(o => inRange(o.date) && isRealExpense(o) && !isFuelOp(o)), o => Math.abs(o.amount));
    const expenses = monthFuel + otherExp, net = income - expenses;
    const eff = income > 0 ? net / income * 100 : 0;
    const per = (v, n) => n > 0 ? v / n : 0;
    const netOrder = per(net, orders), incOrder = per(income, orders);
    const nightPct = per(night * 100, orders), apPct = per(ap * 100, orders);
    const tone = v => v >= 0 ? "pos" : "neg";
    const card = (label, val, sub, color, cls = "") => `<div class="stat-card" style="border-left-color:${color}"><span class="stat-label">${label}</span><span class="stat-value ${cls}">${val}</span><span class="stat-sub">${sub}</span></div>`;
    const effColor = eff >= 60 ? "#34c759" : eff >= 40 ? "#ff9500" : "#ff3b30";

    // ожидаемое число рабочих дней: 15 на полный месяц, для текущего — пропорционально прошедшим дням
    const nd = new Date(), curK = ym(nd.getFullYear(), nd.getMonth() + 1), dimNow = new Date(nd.getFullYear(), nd.getMonth() + 1, 0).getDate();
    const expDays = monthKeys().reduce((s, k) => k > curK ? s : s + (k === curK ? 15 * nd.getDate() / dimNow : 15), 0);

    const tips = [];
    if (income > 0) {
        if (eff < 40) tips.push(`⚠ Низкий КПД (${eff.toFixed(1)}%). Оптимизируйте расходы или увеличивайте заказы.`);
        else if (eff >= 60) tips.push(`✅ Отличный КПД (${eff.toFixed(1)}%). Держите курс!`);
        else tips.push(`📈 КПД средний (${eff.toFixed(1)}%). Есть потенциал для роста.`);
    }
    if (per(monthFuel, orders) > 5) tips.push(`⛽ Высокий расход топлива на заказ (${per(monthFuel, orders).toFixed(2)} лей).`);
    if (orders && netOrder < 10) tips.push(`📊 Чистый доход с заказа низкий (${netOrder.toFixed(2)} лей).`);
    if (orders && nightPct < 30) tips.push(`🌙 Мало ночных заказов (${nightPct.toFixed(0)}%).`);
    if (orders && apPct < 30) tips.push(`📦 Мало «единых» заказов (${apPct.toFixed(0)}%).`);
    if (expDays > 0 && workDays < expDays) tips.push(`📅 Мало рабочих дней (${workDays} из ~${Math.round(expDays)} ожидаемых).`);
    $("orderEconomyContent").innerHTML = `<div class="stats-grid">
        ${card("📊 КПД за период", eff.toFixed(1) + "%", `${income.toFixed(0)} доход − ${expenses.toFixed(0)} расход`, effColor)}
        ${card("💰 Прибыль (чистая)", net.toFixed(0) + " лей", `${workDays} дней, ${orders} заказов`, "#007aff", tone(net))}
        ${card("📦 Доход на заказ", incOrder.toFixed(2) + " лей", `${orders} заказов всего`, "#34c759")}
        ${card("⛽ Топливо на заказ", per(monthFuel, orders).toFixed(2) + " лей", `${monthFuel.toFixed(2)} лей топлива`, "#ff9500")}
        ${card("💰 Расход на заказ", per(expenses, orders).toFixed(2) + " лей", `${expenses.toFixed(2)} лей расходов`, "#ff3b30")}
        ${card("💎 Чистый на заказ", netOrder.toFixed(2) + " лей", `ROI: ${expenses > 0 ? (income / expenses).toFixed(2) : 0}x`, "#007aff", tone(netOrder))}
        ${card("📅 Доход в день", per(income, workDays).toFixed(0) + " лей", `${workDays} рабочих дней`, "#34c759")}
        ${card("📅 Чистый в день", per(net, workDays).toFixed(0) + " лей", `${per(expenses, workDays).toFixed(0)} лей расходов/день`, "#ff9500", tone(per(net, workDays)))}
        <div class="stat-card wide" style="border-left-color:#8e8e93"><span class="stat-label">🔄 Состав заказов</span>
          <div>🌙 <b>${night}</b> (${nightPct.toFixed(0)}%) · 📦 <b>${ap}</b> (${apPct.toFixed(0)}%) · 📊 <b>${orders}</b></div>
          <div class="progress" style="margin-top:6px;display:flex"><div style="background:#007aff;width:${nightPct}%;border-radius:0"></div><div style="background:#ff9500;width:${apPct}%;border-radius:0"></div></div></div>

function renderForecast() {
    const c = $("forecastContent"); if (!c) return;
    const hist = getHistory(), now = new Date(), y = now.getFullYear(), m = now.getMonth() + 1, today = now.getDate(), dim = new Date(y, m, 0).getDate();
    const cur = hist.filter(d => d.date.slice(0, 7) === ym(y, m)), num = d => +d.date.slice(8, 10);
    const earned = sum(cur, d => d.total);
    const worked = cur.filter(d => num(d) <= today && (d.nightOrders > 0 || d.apOrders > 0));
    const avgWorked = worked.length ? sum(worked, d => d.total) / worked.length : 0;
    const st = {};
    hist.forEach(d => { if (!(d.nightOrders > 0 || d.apOrders > 0)) return; const t = d.dayType || "work"; st[t] = st[t] || { n: 0, inc: 0 }; st[t].n++; st[t].inc += d.total; });
    const future = cur.filter(d => num(d) > today);
    const byType = earned + sum(future, d => { const s = st[d.dayType || "work"]; return s ? s.inc / s.n : 0; });
    const byAvg = earned + avgWorked * future.filter(d => d.dayType !== "weekend").length;
    const progress = Math.round(today / dim * 100);
    const typeSummary = TYPE_KEYS.filter(t => st[t]).map(t => `${DAY_TYPES[t].icon} ${DAY_TYPES[t].short}: ~${Math.round(st[t].inc / st[t].n)} лей/день`).join(" • ");
    c.innerHTML = `<b>🔮 Прогноз ${MONTHS[m - 1]} ${y}</b>
      <div class="forecast-grid">
        <div class="forecast-card"><small>💼 Зарплата</small><b>${earned} лей</b></div>
        <div class="forecast-card"><small>📅 Дней</small><b>${today} / ${dim}</b></div>
        <div class="forecast-card"><small>📈 По типам</small><b>${Math.round(byType)} лей</b></div>
        <div class="forecast-card"><small>📊 По среднему</small><b>${Math.round(byAvg)} лей</b></div>
      </div>
      <div class="hint" style="display:flex;justify-content:space-between"><span>Прогресс</span><span>${progress}%</span></div>
      <div class="progress"><div style="width:${progress}%"></div></div>
      ${worked.length ? `<div class="box" style="margin-top:10px">💡 Работали <b>${worked.length}</b> дней, средний доход — <b>${Math.round(avgWorked)} лей</b>. Осталось: <b>${dim - today}</b>.</div>` : ""}
      ${typeSummary ? `<div class="box" style="margin-top:8px;font-size:12px;color:var(--text-dim)">📊 ${typeSummary}</div>` : ""}`;
}

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function fitCanvas(cv, cssW, cssH) {
    const dpr = window.devicePixelRatio || 1;
    cv.style.width = cssW + "px";
    cv.style.height = cssH + "px";
    cv.width = Math.round(cssW * dpr);
    cv.height = Math.round(cssH * dpr);
    const ctx = cv.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return ctx;
}

function drawBars(id, { labels, series, legend }) {
    const cv = $(id); if (!cv) return;
    const grouped = series.length > 1;
    const cssW = Math.max(cv.parentElement.clientWidth || 300, labels.length * (grouped ? 56 : 48));
    const cssH = +(cv.dataset.h || 160);
    const ctx = fitCanvas(cv, cssW, cssH);
    const pad = { top: legend ? 28 : 20, right: 8, bottom: 30, left: 36 };
    const cw = cssW - pad.left - pad.right, ch = cssH - pad.top - pad.bottom;
    const max = Math.max(1, ...series.flatMap(s => s.values));
    const text = css("--text"), dim = css("--text-dim"), line = css("--divider");
    ctx.clearRect(0, 0, cssW, cssH);
    if (legend) legend.forEach((t, j) => { ctx.fillStyle = series[j].color; ctx.fillRect(pad.left + j * 80, 6, 10, 8); ctx.fillStyle = text; ctx.font = "9px sans-serif"; ctx.textAlign = "left"; ctx.fillText(t, pad.left + j * 80 + 14, 13); });
    ctx.lineWidth = 1; ctx.font = "9px sans-serif";
    for (let i = 0; i <= 4; i++) {
        const y = pad.top + ch - i / 4 * ch;
        ctx.strokeStyle = line; ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(cssW - pad.right, y); ctx.stroke();
        ctx.fillStyle = dim; ctx.textAlign = "right"; ctx.fillText(Math.round(max * i / 4), pad.left - 3, y + 3);
    }
    if (!labels.length) { ctx.fillStyle = dim; ctx.textAlign = "center"; ctx.fillText("Нет данных", cssW / 2, pad.top + ch / 2); return; }
    const gap = cw / labels.length, bw = Math.max(3, gap * (grouped ? .32 : .6));
    labels.forEach((l, i) => {
        const cx = pad.left + i * gap + gap / 2;
        series.forEach((s, j) => {
            const v = s.values[i] || 0, bh = v / max * ch, y = pad.top + ch - bh, x = grouped ? cx + (j === 0 ? -bw - 1 : 1) : cx - bw / 2;
            const g = ctx.createLinearGradient(0, y, 0, pad.top + ch); g.addColorStop(0, s.color); g.addColorStop(1, s.color2);
            ctx.fillStyle = g;
            if (bh > 0) {
                if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, bw, bh, 3); ctx.fill(); }
                else ctx.fillRect(x, y, bw, bh);
            }
            if (!grouped && v > 0) { ctx.fillStyle = text; ctx.textAlign = "center"; ctx.fillText(v, cx, y - 3); }
        });
        ctx.fillStyle = dim; ctx.textAlign = "center"; ctx.fillText(l, cx, cssH - 4);
    });
}
function drawPie(id, segs) {
    const cv = $(id); if (!cv) return;
    const cssW = cv.parentElement.clientWidth - 28 || 300, cssH = +(cv.dataset.h || 180);
    const ctx = fitCanvas(cv, cssW, cssH);
    const total = sum(segs, s => s.value);
    if (!total) { ctx.fillStyle = css("--text-dim"); ctx.font = "13px sans-serif"; ctx.textAlign = "center"; ctx.fillText("Нет данных", cssW / 2, cssH / 2); return; }
    const cx = cssW / 2, cy = cssH / 2 - 6, r = Math.min(cx, cy) - 10; let a = -Math.PI / 2;
    segs.forEach(s => {
        if (!s.value) return;
        const sl = s.value / total * 2 * Math.PI;
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, a, a + sl); ctx.closePath(); ctx.fillStyle = s.color; ctx.fill(); ctx.strokeStyle = css("--panel-bg"); ctx.lineWidth = 2; ctx.stroke();
        const pct = Math.round(s.value / total * 100);
        if (pct > 5) { ctx.fillStyle = "#fff"; ctx.font = "bold 11px sans-serif"; ctx.textAlign = "center"; ctx.fillText(pct + "%", cx + Math.cos(a + sl / 2) * r * .65, cy + Math.sin(a + sl / 2) * r * .65); }
        a += sl;
    });
}

// ============================================================
//  КАССА И СКУТЕР (только из localStorage)
// ============================================================
function renderCash() {
    const c = $("cashContent"); if (!c) return;
    const keys = monthKeys(), all = cashOps();
    const ops = all.filter(o => inRange(o.date)), real = ops.filter(isRealExpense);
    const catIs = (o, re) => re.test(catName(o.type));
    const coffeeLunch = real.filter(o => catIs(o, /кофе|обед|еда/i)), washCons = real.filter(o => catIs(o, /мойк|расходник/i));
    const expenses = sum(real, o => Math.abs(o.amount));
    const tips = sum(ops.filter(o => o.type === "tips"), o => o.amount);
    const otherInc = sum(ops.filter(isOtherIncome), o => o.amount);
    const salary = sum(getHistory().filter(d => inRange(d.date)), d => d.total);
    const net = netIncome(salary, tips, otherInc, expenses);

    const fuelPeriod = fuelForPeriod(d => inRange(d));
    const liters = fuelPeriod.liters, fcost = fuelPeriod.sum;
    const km = sum(kmLog().filter(e => inRange(e.date)), e => +e.km || 0);
    const cons = km > 0 ? liters / km * 100 : 0, perKm = km > 0 ? fcost / km : 0;

    // Долги — за всё время, только из cashOperations
    const given = sum(all.filter(o => o.type === "debt_given"), o => Math.abs(o.amount));
    const returned = sum(all.filter(o => o.type === "debt_returned"), o => Math.abs(o.amount));
    const taken = sum(all.filter(o => o.type === "debt_taken"), o => Math.abs(o.amount));
    const repaid = sum(all.filter(o => o.type === "debt_repaid"), o => Math.abs(o.amount));
    const owedToMe = Math.max(given - returned, 0), iOwe = Math.max(taken - repaid, 0);
    const curKm = +(LS("mileageData", {}) || {}).currentKm || 0;
    const left = d => d && typeof d === "object" ? Math.max((+d.interval || 0) - (curKm - (+d.mileage || 0)), 0) : null;
    const oil = left(LS("oilData", null)), filt = left(LS("filterData", null));

    const card = (label, val, sub, color, cls = "") => `<div class="stat-card" style="border-left-color:${color}"><span class="stat-label">${label}</span><span class="stat-value ${cls}">${val}</span><span class="stat-sub">${sub}</span></div>`;
    const cats = {};
    real.forEach(o => { const n = catName(o.type); (cats[n] = cats[n] || { t: 0, n: 0 }); cats[n].t += Math.abs(o.amount); cats[n].n++; });
    const catRows = Object.entries(cats).sort((a, b) => b[1].t - a[1].t).map(([n, v]) =>
        `<div class="top-row"><span>${esc(n)} <small style="color:var(--text-dim)">${v.n} оп.</small></span><span><b>${v.t.toFixed(2)}</b> · ${expenses ? (v.t / expenses * 100).toFixed(0) : 0}%</span></div>`).join("");
    const chart = (title, id) => `<div class="analytics-card" style="margin-top:10px"><h4>${title}</h4><div class="chart-scroll-wrap"><canvas id="${id}" data-h="160"></canvas></div></div>`;

    const fuelSrcNote = fuelPeriod.source !== "fuelLog"
        ? ` <small style="color:var(--text-dim)">(${fuelPeriod.source === "mixed" ? "частично" : "из кассы"}: журнал топлива пуст)</small>`
        : "";

    c.innerHTML = `<div class="hint">Период: <b>${rangeLabel()}</b></div>
      <div class="stats-grid">
        ${card("💰 Чистый доход (зарплата + чаевые + прочий приход − расходы)", net.toFixed(2) + " лей", `${salary.toFixed(0)} зарплата + ${(tips + otherInc).toFixed(0)} приход − ${expenses.toFixed(0)} расход`, "#007aff", net >= 0 ? "pos" : "neg")}
        ${card("💵 Чаевые", tips.toFixed(2) + " лей", `${ops.filter(o => o.type === "tips").length} операций`, "#34c759")}
        ${card("💸 Расходы", expenses.toFixed(2) + " лей", `${real.length} операций, без долгов`, "#ff3b30")}
        ${card("⛽ Топливо", fcost.toFixed(2) + " лей" + fuelSrcNote, `${liters.toFixed(2)} л · ${fuelPeriod.count} заправок`, "#ff9500")}
        ${card("☕🍱 Кофе и обед", sum(coffeeLunch, o => Math.abs(o.amount)).toFixed(2) + " лей", `${coffeeLunch.length} операций`, "#a2845e")}
        ${card("🧼🛢 Мойка и расходники", sum(washCons, o => Math.abs(o.amount)).toFixed(2) + " лей", `${washCons.length} операций`, "#5ac8fa")}
        ${card("⛽ Цена литра (ср.)", (liters > 0 ? fcost / liters : 0).toFixed(2) + " лей", "по заправкам периода", "#ff9500")}
        ${card("🛵 Пробег за период", +km.toFixed(1) + " км", "из дневного лога км", "#8e8e93")}
        ${card("⛽ Расход", cons.toFixed(2) + " л/100км", km > 0 ? "" : "нет км за период", "#ff9500")}
        ${card("💰 Стоимость 1 км", perKm.toFixed(2) + " лей", `${(perKm * 100).toFixed(2)} лей/100км`, "#af52de")}
        ${card("📥 Мне должны", owedToMe.toFixed(2), "всего, не по периоду", "#34c759")}
        ${card("📤 Я должен", iOwe.toFixed(2), "всего, не по периоду", "#ff3b30")}
        ${oil !== null ? card("🛢 До замены масла", +oil.toFixed(1) + " км", "", oil === 0 ? "#ff3b30" : "#007aff", oil === 0 ? "neg" : "") : ""}
        ${filt !== null ? card("💨 До замены фильтра", +filt.toFixed(1) + " км", "", filt === 0 ? "#ff3b30" : "#007aff", filt === 0 ? "neg" : "") : ""}
      </div>
      ${chart("💸 Расходы vs 💵 чаевые по месяцам", "chartCashMonthly")}
      ${chart("⛽ Топливо по месяцам", "chartFuelMonthly")}
      <div class="analytics-card" style="margin-top:10px"><h4>📊 Расходы по категориям</h4>${catRows || empty("Нет расходов за период")}</div>`;

    const inM = (list, k, f) => sum(list.filter(x => (x.date || "").slice(0, 7) === k), f);
    const lbl = keys.map(k => MONTHS_SHORT[+k.slice(5) - 1] + " " + k.slice(2, 4));
    const realAll = all.filter(isRealExpense), tipsAll = all.filter(o => o.type === "tips");
    drawBars("chartCashMonthly", { labels: lbl, legend: ["💸 Расходы", "💵 Чаевые"], series: [
        { values: keys.map(k => Math.round(inM(realAll, k, o => Math.abs(o.amount)))), color: "#ff3b30", color2: "#ff3b30" },
        { values: keys.map(k => Math.round(inM(tipsAll, k, o => o.amount))), color: "#34c759", color2: "#34c759" }] });
    const fuelByMonth = keys.map(k => Math.round(fuelForPeriod(d => (d || "").slice(0, 7) === k).sum));
    drawBars("chartFuelMonthly", { labels: lbl, series: [{ values: fuelByMonth, color: "#ff9500", color2: "#ffb84d" }] });
}

// ============================================================
//  ЗАПУСК
// ============================================================
function initApp() {
    const now = new Date(); rangeFrom = rangeTo = ym(now.getFullYear(), now.getMonth() + 1);
    buildStats(); initThemeToggle();
    window.appReady = true;
    refreshAll();
    window.addEventListener("storage", refreshAll);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshAll(); });
    window.addEventListener("pageshow", e => { if (e.persisted) refreshAll(); });
    // перерисовка графиков при смене ширины (поворот экрана); изменение только высоты игнорируем
    let lastW = window.innerWidth, rt;
    window.addEventListener("resize", () => {
        if (window.innerWidth === lastW) return;
        lastW = window.innerWidth;
        clearTimeout(rt);
        rt = setTimeout(() => { if ($("analytics").open) renderAnalytics(); if ($("cashSection").open) renderCash(); }, 150);
    });
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", initApp); else initApp();
</script>
