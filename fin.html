<script>
(function(){try{var s=localStorage.getItem("theme");var d=s==="dark"||(!s&&window.matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.setAttribute("data-theme",d?"dark":"light");}catch(e){}})();
</script>
<style>
:root{--bg:#f4f5f8;--card:#fff;--tx:#1c1e26;--mut:#6b7185;--line:#e3e5ec;--g:#1f9d68;--r:#d64545;--ac:#2d6b4f;color-scheme:light}
:root[data-theme="dark"]{--bg:#16171d;--card:#1f212b;--tx:#e8e9ee;--mut:#8a90a2;--line:#2a2d3a;--g:#4cc38a;--r:#ef6b6b;--ac:#6ecf9f;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,'Segoe UI',Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(140px + env(safe-area-inset-bottom,0px))}
#app{max-width:560px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h1{font-size:30px;margin:4px 0 8px}h2{font-size:15px;margin:4px 0 10px;color:var(--mut);font-weight:600}
.mut{color:var(--mut);font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);gap:8px}
.row:first-of-type{border-top:0}.row b{white-space:nowrap}.g{color:var(--g)}.r{color:var(--r)}
.two{display:flex;gap:10px}.two>div{flex:1}
.inner-nav{position:sticky;top:0;background:var(--bg);z-index:5;display:flex;gap:6px;padding:8px 0 10px;margin-bottom:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.inner-nav button{flex:1;min-width:0;padding:9px 6px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--tx);font:600 12px -apple-system,'Segoe UI',Roboto,sans-serif;cursor:pointer}
.inner-nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav .in{display:flex;width:100%;max-width:560px}
nav a{flex:1;padding:10px 0 8px;font-size:11px;text-align:center;color:var(--mut);text-decoration:none}
nav a span{display:block;font-size:19px}nav a.on{color:var(--ac);font-weight:700}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:30px;box-shadow:0 4px 14px #0005;z-index:9}
input,select,textarea,button.b{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px;margin:4px 0}
textarea{min-height:120px;font-size:13px}
button.b{background:var(--card);text-align:center;cursor:pointer}button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
label{font-size:13px;color:var(--mut);display:block;margin-top:6px}
#ov{display:none;position:fixed;inset:0;background:#0007;align-items:flex-end;z-index:20}
#ov.on{display:flex}
#sh{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.seg{display:flex;gap:6px;margin-bottom:8px}.seg button{flex:1;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;cursor:pointer}.seg button.on{background:var(--ac);color:#fff}
.err{color:var(--r);font-size:14px;min-height:20px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:#222;color:#fff;padding:9px 14px;border-radius:20px;font-size:14px;display:none;z-index:30}
/* баннер битого JSON */
#brokenBanner{display:none;background:#fff3cd;color:#8a5a00;border-left:4px solid #ffb800;padding:12px 14px;border-radius:12px;margin-bottom:12px;font-size:14px;line-height:1.5}
#brokenBanner.show{display:block}
#brokenBanner button{width:auto;display:inline-block;margin-top:8px;padding:6px 12px;font-size:13px;border-radius:8px;border:1px solid #d29b00;background:#fff;color:#8a5a00;cursor:pointer}
:root[data-theme="dark"] #brokenBanner{background:#2a2008;color:#ffcf80;border-color:#ffb800}
:root[data-theme="dark"] #brokenBanner button{background:#1c1e26;border-color:#8a6a10;color:#ffcf80}
</style></head><body>
<div id="app"></div>
<button class="fab" onclick="sheet('Трата')">＋</button>
<nav><div class="in">
<a href="index.html"><span>📦</span>Учёт</a>

</div></nav>
<div id="ov"><div id="sh"></div></div><div id="toast"></div>
<script>
// ============================================================
//  ФИНАНСЫ — только localStorage["fin"] (+ theme), без облака.
//  Внутренние вкладки: home / sect / wal / more + разделы.
// ============================================================
const KEYS=["kohelki","kat_trat","kat_dohodov","traty","dohody","istorija","byudzhety","celi","dolgi","regulyarnye","kredity","valyuty","kursy","lombard","lombard_info","aktivy","arhiv","kartki"];
const DEF=()=>({kohelki:{"Наличные":0,"Карта":0},kat_trat:["Продукты","Транспорт","Развлечения","Жильё","Коммуналка","Связь","Здоровье","Одежда","Кафе","Прочее"],kat_dohodov:["Зарплата","Подарки","Прочее"],traty:{},dohody:{},istorija:[],byudzhety:{},celi:{},dolgi:[],regulyarnye:[],kredity:[],valyuty:{},kursy:{},lombard:[],lombard_info:{stavka:3,den:25,koshel:"Наличные",proc_ym:"",proc_sum:0},aktivy:[],arhiv:{},kartki:[]});
let S=DEF(),loaded=false,tab="home",lim=40,q="",brokenRaw=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SY={MDL:"лей",USD:"$",EUR:"€"};
const cur=w=>S.valyuty[w]||"MDL",sym=w=>SY[cur(w)]||cur(w),kurs=c=>c==="MDL"?1:(+S.kursy[c]||0);
const fmt=x=>(+x).toLocaleString("ru-RU",{minimumFractionDigits:2,maximumFractionDigits:2});
const r2=x=>Math.round(x*100)/100,num=v=>+String(v).replace(/\s/g,"").replace(",",".");
const nowS=()=>{const d=new Date(),p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes())};
const ops=()=>S.istorija.filter(z=>z&&typeof z==="object");
const nid=()=>Math.max(0,...ops().map(z=>z.id||0))+1;
const opt=(a,s)=>a.map(x=>`<option${x===s?" selected":""}>${esc(x)}</option>`).join("");
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2200)}

/* ---- хранение ---- */
function init(){
  let loc=null,raw=null;
  try{
    raw=localStorage.getItem("fin");
    if(raw) loc=JSON.parse(raw);
  }catch(e){
    // Баг 2: битый JSON → сохраняем копию в fin_broken и НЕ перезаписываем
    brokenRaw = raw;
    try{ localStorage.setItem("fin_broken", raw || ""); }catch(_){}
  }
  if(loc)S=Object.assign(DEF(),loc);
  loaded=true;render();
  // Если JSON не было вообще — создаём дефолт. Если был битым — показываем баннер и НЕ трогаем.
  if(!loc && raw === null) save();
}

// Сохранение: пишем сразу + аварийно на pagehide/visibilitychange
let tmr=null;
function persistNow(){
  if(!loaded) return;
  S._ts=Date.now();
  try{ localStorage.setItem("fin", JSON.stringify(S)); }
  catch(e){ toast("Не удалось сохранить"); }
}
function save(){
  if(!loaded) return;
  clearTimeout(tmr);
  // пишем СРАЗУ, чтобы не терять данные при переходе по табу
  persistNow();
}
// Аварийное сохранение при уходе/скрытии (на случай, если браузер выгружает вкладку)
window.addEventListener("pagehide", () => { if(loaded){ clearTimeout(tmr); persistNow(); } });
document.addEventListener("visibilitychange", () => { if(document.hidden && loaded){ clearTimeout(tmr); persistNow(); } });

/* ---- баннер битого JSON ---- */
function showBrokenBanner(){
  const old=document.getElementById("brokenBanner"); if(old) old.remove();
  if(!brokenRaw) return;
  const div=document.createElement("div");
  div.id="brokenBanner"; div.className="show";
  div.innerHTML = `⚠ <b>Данные не прочитаны.</b> В localStorage["fin"] был повреждённый JSON. Копия сохранена в <code>fin_broken</code>. Приложение показывает пустые данные, но <b>не перезаписывает</b> испорченное. ` +
    `<button onclick="recoverBroken()">Показать копию</button> <button onclick="discardBroken()">Начать с чистого листа</button>`;
  document.getElementById("app").prepend(div);
}
function recoverBroken(){
  try{ navigator.clipboard.writeText(brokenRaw||"") ; toast("Скопировано в буфер"); }catch(e){ toast("Не удалось скопировать"); }
  showConfirmDialog("Показать содержимое fin_broken?", ()=>{
    $("sh").innerHTML=`<h2>fin_broken</h2><textarea readonly style="min-height:220px">${esc(brokenRaw||"")}</textarea><button class="b" onclick="closeSheet()">Закрыть</button>`;
    $("ov").classList.add("on");
  });
}
function discardBroken(){
  showConfirmDialog("Точно начать с чистых данных?\nКопия fin_broken останется в localStorage.", ()=>{
    brokenRaw=null; S=DEF(); save(); location.reload();
  });
}

/* ---- логика ---- */
function addOp(tip,w,kat,s,note){
  s=r2(s);if(!(s>0))throw"Сумма должна быть больше нуля";kat=kat.trim();if(!kat)throw"Выбери категорию";
  if(tip==="Трата"){if(S.kohelki[w]<s)throw`Недостаточно средств: на «${w}» только ${fmt(S.kohelki[w])}`;
    S.kohelki[w]=r2(S.kohelki[w]-s);S.traty[kat]=r2((S.traty[kat]||0)+s);if(!S.kat_trat.includes(kat))S.kat_trat.push(kat)}
  else{S.kohelki[w]=r2(S.kohelki[w]+s);S.dohody[kat]=r2((S.dohody[kat]||0)+s);if(!S.kat_dohodov.includes(kat))S.kat_dohodov.push(kat)}
  const z={id:nid(),data:nowS(),tip,summa:s,koshel:w,kat};if(note)z.zametka=note;
  if(cur(w)!=="MDL")z.baz=r2(s*kurs(cur(w)));S.istorija.push(z);save()}
function transfer(a,b,s,t,note){
  s=r2(s);if(!(s>0))throw"Сумма должна быть больше нуля";if(a===b)throw"Выбери разные кошельки";
  if(typeof b==="string"&&b.startsWith("💳 ")){
    const c=S.kartki.find(x=>"💳 "+x.nazvanie===b);if(!c)throw"Карта не найдена";
    if(cur(a)!=="MDL")throw"Платёж по карте — только с кошелька в леях";
    if(S.kohelki[a]<s)throw`Недостаточно средств на «${a}»`;if(s>c.dolg)throw"Больше текущего долга по карте ("+fmt(c.dolg)+")";
    const pp=c.posl;S.kohelki[a]=r2(S.kohelki[a]-s);c.dolg=r2(c.dolg-s);if(!c.min||s>=c.min||c.dolg<=0)c.posl=nowS().slice(0,7);
    rec("Кредитка",s,a,{kat:c.nazvanie,napr:"платёж",cid:c.id,pp,zametka:note});return}
  if(S.kohelki[a]<s)throw`Недостаточно средств на «${a}»`;
  const same=cur(a)===cur(b);if(!same){t=r2(t);if(!(t>0))throw"Укажи сумму к зачислению"}else t=s;
  S.kohelki[a]=r2(S.kohelki[a]-s);S.kohelki[b]=r2(S.kohelki[b]+t);
  const z={id:nid(),data:nowS(),tip:same?"Перевод":"Конвертация",summa:s,koshel:a,kuda:b};
  if(!same)z.summa_kuda=t;if(note)z.zametka=note;S.istorija.push(z);save()}
function undo(id){
  const z=ops().find(x=>x.id===id);if(!z)return;
  try{const t=z.tip,w=z.koshel,s=z.summa;
    if(!["Трата","Доход","Перевод","Корректировка"].includes(t))throw"Эту операцию нельзя отменить здесь";
    if(!(w in S.kohelki)||(t==="Перевод"&&!(z.kuda in S.kohelki)))throw"Кошелёк из этой операции удалён";
    if(t==="Трата"){S.kohelki[w]=r2(S.kohelki[w]+s);S.traty[z.kat]=Math.max(0,r2((S.traty[z.kat]||0)-s))}
    else if(t==="Доход"){if(S.kohelki[w]<s)throw"На кошельке уже меньше этой суммы";S.kohelki[w]=r2(S.kohelki[w]-s);S.dohody[z.kat]=Math.max(0,r2((S.dohody[z.kat]||0)-s))}
    else if(t==="Корректировка"){if(S.kohelki[w]-s<0)throw"Баланс станет отрицательным";S.kohelki[w]=r2(S.kohelki[w]-s)}
    else{if(S.kohelki[z.kuda]<s)throw"На кошельке назначения уже меньше";S.kohelki[z.kuda]=r2(S.kohelki[z.kuda]-s);S.kohelki[w]=r2(S.kohelki[w]+s)}
    S.istorija.splice(S.istorija.indexOf(z),1);save();render();toast("Операция отменена")
  }catch(e){toast(typeof e==="string"?e:e.message)}
}
function ask(t,yes){$("sh").innerHTML=`<p>${esc(t)}</p><button class="b pri" id="yes">Да</button><button class="b" onclick="closeSheet()">Нет</button>`;$("ov").classList.add("on");$("yes").onclick=()=>{closeSheet();yes()}}
function askUndo(id){const z=ops().find(x=>x.id===id);if(z)opMenu(id)}

/* ---- операции ---- */
function row(z){
  const ic={"Трата":"➖","Доход":"➕","Перевод":"🔄","Конвертация":"🔄","Кредитка":"💳","Долг":"🤝","Кредит":"🏛","Ломбард":"🥇","Цель":"🎯"}[z.tip]||"•";
  const kp=z.tip==="Кредитка"&&(z.napr==="покупка"||z.napr==="проценты"),sg=(z.tip==="Трата"||kp)?"-":z.tip==="Доход"?"+":"",c=(z.tip==="Трата"||kp)?"r":z.tip==="Доход"?"g":"";
  const w=z.koshel||"",ttl=z.kat||(z.kuda?w+" → "+z.kuda:z.tip);
  return `<div class="row" onclick="askUndo(${z.id})"><div>${ic} ${esc(ttl)}<div class="mut">${esc((z.data||"").slice(0,16))} · ${esc(w)}${z.zametka?" · "+esc(z.zametka):""}</div></div><b class="${c}">${sg}${fmt(z.summa)} ${esc(SY[cur(w)]||"")}</b></div>`}

/* ---- главная ---- */
function home(){
  const ws=Object.keys(S.kohelki),tot=ws.reduce((a,w)=>a+S.kohelki[w]*kurs(cur(w)),0),ym=nowS().slice(0,7);let sp=0,inc=0;
  ops().forEach(z=>{if((z.data||"").startsWith(ym)){const v=z.baz??z.summa;if(z.tip==="Трата"||(z.tip==="Кредитка"&&(z.napr==="покупка"||z.napr==="проценты")))sp+=v;if(z.tip==="Доход")inc+=v}});
  const last=ops().slice(-5).reverse().map(row).join("")||`<div class="mut">Пока нет операций</div>`;
  return innerNav()+
  `<div class="card"><div class="mut">Всего в кошельках</div><h1>${fmt(tot)} лей</h1><div class="two"><div><div class="mut">Доходы за месяц</div><b class="g">+${fmt(inc)}</b></div><div><div class="mut">Траты за месяц</div><b class="r">-${fmt(sp)}</b></div></div></div>
  <div class="card"><h2>Кошельки</h2>${ws.map(w=>`<div class="row" onclick="tab='wal';render()"><span>${esc(w)} <span class="mut">${esc(cur(w))}</span></span><b>${fmt(S.kohelki[w])} ${esc(sym(w))}</b></div>`).join("")}</div>
  <div class="card"><h2>Последние операции</h2>${last}<button class="b pri" style="margin-top:10px" onclick="tab='hist';render()">🕘 Вся история</button></div>`}

/* ---- история ---- */
function hist(){
  const t=q.toLowerCase(),all=ops().slice().reverse().filter(z=>!t||[z.kat,z.koshel,z.kuda,z.zametka,z.tip,z.data].join(" ").toLowerCase().includes(t));
  return innerNav()+
  `<button class="b" onclick="tab='more';render()">← Назад</button><h2>История</h2>`+
  `<input placeholder="Поиск" value="${esc(q)}" oninput="q=this.value;lim=40;render(1)"><div class="card" style="margin-top:8px">${all.slice(0,lim).map(row).join("")||`<div class="mut">Ничего нет</div>`}</div>${all.length>lim?`<button class="b" onclick="lim+=40;render()">Показать ещё</button>`:""}<div class="mut">Нажми на операцию, чтобы изменить или отменить.</div>`}

/* ---- кошельки ---- */
function wal(){
  const cs=[...new Set(Object.keys(S.kohelki).map(cur).concat(Object.keys(S.kursy)))].filter(c=>c!=="MDL");
  return innerNav()+
  `<div class="card"><h2>Кошельки · нажми для действий</h2>${Object.keys(S.kohelki).map(w=>`<div class="row" onclick="walMenu(${Object.keys(S.kohelki).indexOf(w)})"><span>✎ ${esc(w)} <span class="mut">${esc(cur(w))}</span></span><b>${fmt(S.kohelki[w])} ${esc(sym(w))}</b></div>`).join("")}${S.kartki.length?`<div class="mut" style="margin:12px 0 2px">💳 Кредитные карты · не входят в общий итог</div>`+S.kartki.map(c=>{const bl=r2(c.limit-c.dolg);return `<div class="row" onclick="tab='cards';render()"><span>💳 ${esc(c.nazvanie)} <span class="mut">долг ${fmt(c.dolg)}</span></span><b class="${bl<0?"r":""}">${bl<0?"−":""}${fmt(Math.abs(bl))} лей</b></div>`}).join(""):""}</div>
  ${cs.length?`<div class="card"><h2>Курсы к лею</h2>${cs.map(c=>`<label>1 ${esc(c)} =</label><input inputmode="decimal" value="${S.kursy[c]||""}" onchange="setRate('${esc(c)}',this.value)">`).join("")}</div>`:""}
  <div class="card"><h2>Новый кошелёк</h2><input id="nw" placeholder="Название"><select id="nc"><option>MDL</option><option>USD</option><option>EUR</option></select><input id="nr" inputmode="decimal" placeholder="Курс к лею (для USD/EUR)"><button class="b pri" onclick="addW()">Добавить</button></div>`}
function setRate(c,v){const x=num(v);if(x>0){S.kursy[c]=x;save();render();toast("Курс сохранён")}}
function addW(){
  const n=$("nw").value.trim(),c=$("nc").value,r=num($("nr").value);
  if(!n)return toast("Введи название");if(n in S.kohelki)return toast("Такой кошелёк уже есть");
  if(c!=="MDL"&&!(r>0)&&!(S.kursy[c]>0))return toast("Укажи курс");
  S.kohelki[n]=0;if(c!=="MDL"){S.valyuty[n]=c;if(r>0)S.kursy[c]=r}save();render();toast("Кошелёк добавлен")}

/* ---- разделы и «ещё» ---- */
function sect(){
  return innerNav()+
  `<div class="card"><h2>Разделы</h2>
    <button class="b" onclick="tab='bud';render()">💳 Бюджеты</button>
    <button class="b" onclick="tab='debt';render()">🤝 Долги</button>
    <button class="b" onclick="tab='cred';render()">🏛 Кредиты и ломбард</button>
    <button class="b" onclick="tab='cards';render()">💳 Кредитные карты</button>
    <button class="b" onclick="tab='rep';render()">📊 Отчёты и капитал</button>
    <button class="b" onclick="tab='goal';render()">🎯 Цели</button>
    <button class="b" onclick="tab='reg';render()">🔁 Регулярные платежи</button>
    <button class="b" onclick="tab='asset';render()">🏺 Активы</button>
    <button class="b" onclick="tab='cat';render()">🗂 Категории</button>
    <button class="b" onclick="rst()">🗑 Сбросить всё</button>
  </div>`
}
function more(){
  return innerNav()+
  `<div class="card"><button class="b pri" onclick="tab='hist';render()">🕘 История</button><button class="b" onclick="rst()">🗑 Сбросить всё</button></div>

function pyj(s){

      while(j<s.length&&s[j]!==c){if(s[j]==="\\"&&j+1<s.length){v+=s[j]+s[j+1];j+=2}else v+=s[j++]}
      let d;try{d=JSON.parse('"'+v.replace(/\\'/g,"'").replace(/(^|[^\\])"/g,'$1\\"')+'"')}catch(e){d=v}

    try{o[x[0]]=JSON.parse(pyj(blk.slice(x[1],e).trim()))}catch(e2){}});return o}

function payL(){const ym=nowS().slice(0,7),I=S.lombard_info,LO=()=>S.lombard.filter(b=>b.ostatok>0.005),pm=r2(LO().reduce((a,b)=>a+b.summa,0)*I.stavka/100),due=Math.max(0,r2(pm-(I.proc_ym===ym?I.proc_sum:0))),tot=r2(LO().reduce((a,b)=>a+b.ostatok,0));mini("Платёж по ломбарду",[["w","Кошелёк",Object.keys(S.kohelki).filter(x=>cur(x)==="MDL"),I.koshel],["s","Сумма (макс. "+fmt(r2(due+tot))+")",null,due||"",1]],v=>{const s=Math.min(pos(v.s),r2(due+tot));if(S.kohelki[v.w]<s)throw"Недостаточно средств";const pr=Math.min(s,due);let rest=r2(s-pr);const det=[];LO().forEach(b=>{if(rest<=0)return;const x=Math.min(rest,b.ostatok);b.ostatok=r2(b.ostatok-x);rest=r2(rest-x);det.push([b.id,x]);if(b.ostatok<=0.005)b.ostatok=0});S.kohelki[v.w]=r2(S.kohelki[v.w]-s);if(I.proc_ym!==ym){I.proc_ym=ym;I.proc_sum=0}I.proc_sum=r2(I.proc_sum+pr);rec("Ломбард",s,v.w,{kat:"Ломбард",napr:"платёж",osn:r2(s-pr),proc:pr,det})},"Проценты к оплате в этом месяце: "+fmt(due))}

function cardNew(){mini("Новая кредитная карта",[["n","Название",null,""],["l","Лимит",null,"",1],["d","Долг банку (потрачено + проценты)",null,"0",1],["r","Ставка, % годовых",null,"",1],["y","День платежа (1-31)",null,"",1],["m","Мин. платёж в месяц",null,"",1]],v=>{

function undoCard(id){const z=ops().find(x=>x.id===id);if(!z)return;
  try{const c=S.kartki.find(x=>x.id===z.cid);if(!c)throw"Карта удалена";const s=z.summa,n=z.napr;
    if(n==="покупка"){c.dolg=r2(c.dolg-s);S.traty[z.kat]=Math.max(0,r2((S.traty[z.kat]||0)-s))}
    else if(n==="проценты"){c.dolg=r2(c.dolg-s)}
    else if(n==="платёж"){if(!(z.koshel in S.kohelki))throw"Кошелёк из операции удалён";c.dolg=r2(c.dolg+s);S.kohelki[z.koshel]=r2(S.kohelki[z.koshel]+s);c.posl=z.pp||""}
    else if(n==="снятие"){if(!(z.koshel in S.kohelki)||S.kohelki[z.koshel]<s)throw"На кошельке уже меньше этой суммы";S.kohelki[z.koshel]=r2(S.kohelki[z.koshel]-s);c.dolg=r2(c.dolg-s)}
    else if(n==="корректировка"){c.dolg=r2(c.dolg-z.d)}
    else throw"Эту операцию нельзя отменить";
    c.dolg=Math.max(0,c.dolg);S.istorija.splice(S.istorija.indexOf(z),1);save();render();toast("Операция отменена")
  }catch(e){toast(typeof e==="string"?e:e.message)}}
